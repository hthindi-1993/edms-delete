[project]
name = "edms_delete"
version = "0.1.0"
description = "EDMS file deletion orchestration: CDF instances, RAW state store, and VM file paths."
authors = [{ name = "MPC", email = "GBabel@marathonpetroleum.com" }]
requires-python = ">=3.11,<3.14"
readme = "README.md"

dependencies = [
    "cognite-extractor-utils>=7.7.0",
    "cognite-extractor-manager (>=2.0.0,<3.0.0)",
    "uv (>=0.7.19,<0.8.0)",
    "cognite-sdk (>=7.76.0,<8.0.0)",
    "pyjwt>=2.12.0",
    "pyinstaller (>=6.14.2,<7.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "urllib3 (>=2.7.0)",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "macholib>=1.16.3 ; sys_platform == 'darwin'",
    "pefile>=2023.2.7 ; sys_platform == 'win32'",
    "pywin32-ctypes>=0.2.3 ; sys_platform == 'win32'",
]

[project.scripts]
edms_delete = "edms_delete.__main__:main"

[tool.ruff]
target-version = "py311"
exclude = [".git", ".mypy_cache", ".ruff_cache"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "T20", "UP"]
fixable = ["A", "B", "C", "D", "E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["edms_delete"]

[tool.hatch.build.targets.sdist]
only-include = ["edms_delete"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
